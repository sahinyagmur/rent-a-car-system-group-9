# One command starts everything:   docker compose up --build
# Then open http://localhost:5000
#
# Settings come from a .env file next to this one (copy .env.example).
# Without .env the development defaults below are used — set real values on the server.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rentacar_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Run once, on the first start with an empty volume
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./backend/queries.sql:/queries/queries.sql:ro
    # Not published to the host: only the web container can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rentacar_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${WEB_PORT:-5000}:5000"

  # Optional HTTPS for the live server: docker compose --profile https up -d
  # Needs DOMAIN in .env and the domain's DNS pointing to the server.
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
