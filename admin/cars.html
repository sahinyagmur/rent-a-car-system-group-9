<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars — Admin — G9 Rent a Car</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="admin">
<main class="container"><div id="admin"></div></main>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
<script>
AdminCrud({
  resource: "cars", title: "Cars", singular: "car",
  defaults: { status: "Available" },
  columns: [
    { label: "#", value: r => `<span class="muted">${r.id}</span>` },
    { label: "Car", value: r => `<strong>${UI.esc(r.brand)} ${UI.esc(r.model)}</strong>` },
    { label: "Plate", value: r => UI.esc(r.license_plate) },
    { label: "Year", value: r => r.year },
    { label: "Price / day", value: r => UI.money(r.price_per_day) },
    { label: "Status", value: r => UI.badge(r.status) }
  ],
  fields: [
    { key: "brand", label: "Brand", required: true, maxlength: 100 },
    { key: "model", label: "Model", required: true, maxlength: 100 },
    { key: "license_plate", label: "License plate", required: true, maxlength: 30, hint: "e.g. 06 ABC 123", transform: v => v.toUpperCase() },
    { key: "year", label: "Year", type: "number", required: true, min: 1886, max: 2100, step: 1 },
    { key: "price_per_day", label: "Price per day (TL)", type: "number", required: true, min: 0, step: "0.01" },
    { key: "status", label: "Status", type: "select", required: true, options: ["Available", "Rented", "Maintenance"] }
  ]
});
</script>
</body>
</html>
