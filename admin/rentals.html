<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rentals — Admin — G9 Rent a Car</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="admin">
<main class="container"><div id="admin"></div></main>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
<script>
const paidFor = (x, id) => x.payments
  .filter(p => p.rental_id === id && p.payment_status === "Paid")
  .reduce((s, p) => s + Number(p.amount), 0);

AdminCrud({
  resource: "rentals", title: "Rentals", singular: "rental",
  refs: ["customers", "cars", "payments"],
  defaults: { status: "Pending" },
  columns: [
    { label: "#", value: r => `<span class="muted">${r.id}</span>` },
    { label: "Customer", value: (r, x) => UI.esc((x.customersById.get(r.customer_id) || {}).name || "#" + r.customer_id) },
    { label: "Car", value: (r, x) => UI.esc(Admin.carName(x.carsById.get(r.car_id))) },
    { label: "Dates", value: r => `${UI.date(r.start_date)} – ${UI.date(r.end_date)}` },
    { label: "Total", value: r => UI.money(r.total_price) },
    { label: "Remaining", value: (r, x) => `<strong>${UI.money(Math.max(0, r.total_price - paidFor(x, r.id)))}</strong>` },
    { label: "Status", value: r => UI.badge(r.status) }
  ],
  fields: [
    { key: "customer_id", label: "Customer", type: "ref", ref: "customers", required: true, refLabel: c => `${c.name} · ${c.driver_license_no}` },
    { key: "car_id", label: "Car", type: "ref", ref: "cars", required: true, refLabel: c => `${c.brand} ${c.model} · ${c.license_plate} · ${UI.money(c.price_per_day)}/day` },
    { key: "start_date", label: "Start date", type: "date", required: true },
    { key: "end_date", label: "End date", type: "date", required: true },
    { key: "total_price", label: "Total price (TL)", type: "number", min: 0, step: "0.01", hint: "Leave empty to calculate: days × daily price." },
    { key: "status", label: "Status", type: "select", required: true, options: ["Pending", "Active", "Completed", "Cancelled"] }
  ],
  validate(d) {
    if (d.start_date && d.end_date && d.end_date < d.start_date) throw new Error("End date must be on or after start date.");
  }
});
</script>
</body>
</html>
