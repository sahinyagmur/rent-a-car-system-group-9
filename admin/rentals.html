
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #1e293b;
            padding: 30px;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 { color: #1e40af; }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th { background: #f1f5f9; }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .edit { background: #64748b; }
        .delete { background: #dc2626; }

        .table-wrapper { overflow-x: auto; }
    </style>
</head>

<body>
<div class="container">
    <h1>Rental Management</h1>
    <p>Manage vehicle rentals in the Rent a Car system.</p>

    <div class="card">
        <h2>Rental List</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Rental ID</th>
                        <th>Customer ID</th>
                        <th>Car ID</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="rentalTable"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2 id="formTitle">Add New Rental</h2>

        <form id="rentalForm">
            <input id="customerId" type="number" min="1"
                   placeholder="Customer ID" required>

            <input id="carId" type="number" min="1"
                   placeholder="Car ID" required>

            <label for="startDate">Start Date:</label>
            <input id="startDate" type="date" required>

            <label for="endDate">End Date:</label>
            <input id="endDate" type="date" required>

            <button id="saveBtn" type="submit">Add Rental</button>
        </form>
    </div>

    <a href="dashboard.html">Back to Dashboard</a>
</div>

<script>
    // Temporary sample data; not connected to PostgreSQL.
    let rentals = [
        {
            id: 1,
            customerId: 1,
            carId: 1,
            startDate: "2026-11-21",
            endDate: "2026-11-24"
        }
    ];

    let nextId = 2;
    let editingId = null;

    function renderRentals() {
        const table = document.getElementById("rentalTable");
        table.innerHTML = "";

        rentals.forEach(rental => {
            const row = document.createElement("tr");

            [
                rental.id,
                rental.customerId,
                rental.carId,
                rental.startDate,
                rental.endDate
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actions = document.createElement("td");

            const editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.className = "edit";

            editBtn.addEventListener("click", () => {
                editingId = rental.id;
                document.getElementById("customerId").value =
                    rental.customerId;
                document.getElementById("carId").value =
                    rental.carId;
                document.getElementById("startDate").value =
                    rental.startDate;
                document.getElementById("endDate").value =
                    rental.endDate;
                document.getElementById("formTitle").textContent =
                    "Edit Rental";
                document.getElementById("saveBtn").textContent =
                    "Save Changes";
            });

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.className = "delete";

            deleteBtn.addEventListener("click", () => {
                if (!confirm("Delete this rental?")) return;
                rentals = rentals.filter(r => r.id !== rental.id);
                if (editingId === rental.id) resetForm();
                renderRentals();
            });

            actions.appendChild(editBtn);
            actions.appendChild(document.createTextNode(" "));
            actions.appendChild(deleteBtn);
            row.appendChild(actions);
            table.appendChild(row);
        });
    }

    function resetForm() {
        document.getElementById("rentalForm").reset();
        document.getElementById("formTitle").textContent =
            "Add New Rental";
        document.getElementById("saveBtn").textContent =
            "Add Rental";
        editingId = null;
    }

    document.getElementById("rentalForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            const customerId =
                Number(document.getElementById("customerId").value);
            const carId =
                Number(document.getElementById("carId").value);
            const startDate =
                document.getElementById("startDate").value;
            const endDate =
                document.getElementById("endDate").value;

            if (!customerId || !carId || !startDate || !endDate) {
                alert("Please fill in all fields.");
                return;
            }

            if (endDate < startDate) {
                alert("End date cannot be before start date.");
                return;
            }

            if (editingId !== null) {
                const rental = rentals.find(r => r.id === editingId);
                if (rental) {
                    rental.customerId = customerId;
                    rental.carId = carId;
                    rental.startDate = startDate;
                    rental.endDate = endDate;
                }
            } else {
                rentals.push({
                    id: nextId++,
                    customerId,
                    carId,
                    startDate,
                    endDate
                });
            }

            resetForm();
            renderRentals();
        });

    renderRentals();
</script>
</body>
</html>
