<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments — Admin — G9 Rent a Car</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="admin">
<main class="container"><div id="admin"></div></main>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
<script>
AdminCrud({
  resource: "payments", title: "Payments", singular: "payment",
  refs: ["rentals", "customers", "cars"],
  defaults: { payment_method: "Card", payment_status: "Paid" },
  columns: [
    { label: "#", value: r => `<span class="muted">${r.id}</span>` },
    { label: "Rental", value: (r, x) => {
        const rent = x.rentalsById.get(r.rental_id);
        if (!rent) return "#" + r.rental_id;
        const c = x.customersById.get(rent.customer_id);
        return `#${rent.id} · ${UI.esc(c ? c.name : "")}<div class="small muted">${UI.esc(Admin.carName(x.carsById.get(rent.car_id)))}</div>`;
      } },
    { label: "Date", value: r => UI.date(r.payment_date) },
    { label: "Amount", value: r => `<strong>${UI.money(r.amount)}</strong>` },
    { label: "Method", value: r => UI.esc(r.payment_method) },
    { label: "Status", value: r => UI.badge(r.payment_status) }
  ],
  fields: [
    { key: "rental_id", label: "Rental", type: "ref", ref: "rentals", required: true,
      refLabel: (r, x) => `#${r.id} · ${(x.customersById.get(r.customer_id) || {}).name || ""} · ${Admin.carName(x.carsById.get(r.car_id))} · ${UI.money(r.total_price)}` },
    { key: "payment_date", label: "Payment date", type: "date", hint: "Empty = today." },
    { key: "amount", label: "Amount (TL)", type: "number", required: true, min: 0, step: "0.01" },
    { key: "payment_method", label: "Method", type: "select", required: true, options: ["Cash", "Card"] },
    { key: "payment_status", label: "Status", type: "select", required: true, options: ["Paid", "Pending"] }
  ]
});
</script>
</body>
</html>
