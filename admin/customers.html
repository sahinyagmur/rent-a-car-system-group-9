<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — Admin — G9 Rent a Car</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="admin">
<main class="container"><div id="admin"></div></main>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
<script>
AdminCrud({
  resource: "customers", title: "Customers", singular: "customer",
  columns: [
    { label: "#", value: r => `<span class="muted">${r.id}</span>` },
    { label: "Name", value: r => `<strong>${UI.esc(r.name)}</strong>` },
    { label: "E-mail", value: r => UI.esc(r.email) },
    { label: "Phone", value: r => UI.esc(r.phone) },
    { label: "Driver license", value: r => UI.esc(r.driver_license_no) },
    { label: "Account", value: r => r.user_id ? `<span class="badge badge-info">Online</span>` : `<span class="badge">Walk-in</span>` }
  ],
  fields: [
    { key: "name", label: "Full name", required: true, maxlength: 150 },
    { key: "email", label: "E-mail", type: "email", required: true, maxlength: 255, transform: v => v.toLowerCase() },
    { key: "phone", label: "Phone", type: "tel", required: true, maxlength: 30 },
    { key: "driver_license_no", label: "Driver license number", required: true, maxlength: 30, transform: v => v.toUpperCase() }
  ],
  validate(d) {
    if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) throw new Error("Enter a valid e-mail address.");
  }
});
</script>
</body>
</html>
