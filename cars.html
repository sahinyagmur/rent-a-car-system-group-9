
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #1e293b;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #1e40af;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .edit {
            background: #64748b;
        }

        .delete {
            background: #dc2626;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: #1e40af;
        }

        .actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Car Management</h1>
    <p>Manage vehicles in the Rent a Car system.</p>

    <div class="card">
        <h2>Car List</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Car ID</th>
                        <th>Brand</th>
                        <th>Model</th>
                        <th>License Plate</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="carTable"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2 id="formTitle">Add New Car</h2>

        <form id="carForm">
            <input type="text" id="brand"
                   placeholder="Brand" required>

            <input type="text" id="model"
                   placeholder="Model" required>

            <input type="text" id="licensePlate"
                   placeholder="License Plate" required>

            <select id="status">
                <option value="Available">Available</option>
                <option value="Rented">Rented</option>
                <option value="Maintenance">Maintenance</option>
            </select>

            <button type="submit" id="saveBtn">
                Add Car
            </button>
        </form>
    </div>

    <a class="back-link" href="dashboard.html">
        Back to Dashboard
    </a>

</div>

<script>
    // Temporary browser-only data.
    // The Flask backend will later replace this sample array.
    let cars = [
        {
            id: 1,
            brand: "Mercedes-Benz",
            model: "C200",
            licensePlate: "06 MRC 202",
            status: "Available"
        }
    ];

    let nextId = 2;
    let editingId = null;

    function renderCars() {
        const table = document.getElementById("carTable");
        table.innerHTML = "";

        cars.forEach(car => {
            const row = document.createElement("tr");

            [
                car.id,
                car.brand,
                car.model,
                car.licensePlate,
                car.status
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actions = document.createElement("td");
            actions.className = "actions";

            const editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.className = "edit";

            editBtn.addEventListener("click", () => {
                editingId = car.id;

                document.getElementById("brand").value =
                    car.brand;
                document.getElementById("model").value =
                    car.model;
                document.getElementById("licensePlate").value =
                    car.licensePlate;
                document.getElementById("status").value =
                    car.status;

                document.getElementById("formTitle").textContent =
                    "Edit Car";
                document.getElementById("saveBtn").textContent =
                    "Save Changes";
            });

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.className = "delete";

            deleteBtn.addEventListener("click", () => {
                if (!confirm("Delete this car?")) return;

                cars = cars.filter(c => c.id !== car.id);

                if (editingId === car.id) {
                    resetForm();
                }

                renderCars();
            });

            actions.appendChild(editBtn);
            actions.appendChild(deleteBtn);
            row.appendChild(actions);
            table.appendChild(row);
        });
    }

    function resetForm() {
        document.getElementById("carForm").reset();

        document.getElementById("formTitle").textContent =
            "Add New Car";
        document.getElementById("saveBtn").textContent =
            "Add Car";

        editingId = null;
    }

    document.getElementById("carForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            const brand =
                document.getElementById("brand").value.trim();
            const model =
                document.getElementById("model").value.trim();
            const licensePlate =
                document.getElementById("licensePlate").value.trim();
            const status =
                document.getElementById("status").value;

            if (!brand || !model || !licensePlate) {
                alert("Please fill in all fields.");
                return;
            }

            if (editingId !== null) {
                const car = cars.find(c => c.id === editingId);

                if (car) {
                    car.brand = brand;
                    car.model = model;
                    car.licensePlate = licensePlate;
                    car.status = status;
                }
            } else {
                cars.push({
                    id: nextId++,
                    brand,
                    model,
                    licensePlate,
                    status
                });
            }

            resetForm();
            renderCars();
        });

    renderCars();
</script>
</body>
</html>
