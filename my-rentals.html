<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My rentals — G9 Rent a Car</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="my-rentals">
<main class="container">
  <div class="page-head section-head" style="margin-bottom:0">
    <div>
      <span class="eyebrow">Your account</span>
      <h1>My rentals</h1>
    </div>
    <a class="btn btn-accent" href="cars.html">Book another car</a>
  </div>
  <div id="notice"></div>
  <div class="card" style="overflow:hidden"><div class="table-wrap" id="content"><p class="muted" style="padding:20px">Loading…</p></div></div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  const user = Auth.require("customer");
  if (!user) return;
  const box = document.getElementById("content");
  const newId = Number(UI.qs("new"));

  async function render() {
    let rentals, cars, payments;
    try {
      [rentals, cars, payments] = await Promise.all([API.list("rentals"), API.list("cars"), API.list("payments")]);
    } catch (e) {
      box.innerHTML = `<div class="empty"><h3>Could not load rentals</h3><p>${UI.esc(e.message)}</p></div>`;
      return;
    }
    // Live backend already returns only this customer's rows; filter again for mock mode
    rentals = rentals.filter(r => r.customer_id === user.customer_id)
      .sort((a, b) => b.start_date.localeCompare(a.start_date));
    const carById = new Map(cars.map(c => [c.id, c]));
    const paid = id => payments.filter(p => p.rental_id === id && p.payment_status === "Paid")
      .reduce((s, p) => s + Number(p.amount), 0);

    if (!rentals.length) {
      box.innerHTML = `<div class="empty" style="border:0"><h3>No rentals yet</h3><p>When you book a car it shows up here.</p><a class="btn btn-accent" href="cars.html">Find a car</a></div>`;
      return;
    }
    box.innerHTML = `
      <table class="table">
        <thead><tr><th>#</th><th>Car</th><th>Dates</th><th>Total</th><th>Paid</th><th>Remaining</th><th>Status</th><th></th></tr></thead>
        <tbody>${rentals.map(r => {
          const car = carById.get(r.car_id) || { brand: "Car", model: "#" + r.car_id };
          const p = r.paid_amount ?? paid(r.id);
          const rest = r.remaining ?? Math.max(0, r.total_price - p);
          return `<tr${r.id === newId ? ' style="background:var(--accent-soft)"' : ""}>
            <td class="muted">${r.id}</td>
            <td><strong>${UI.esc(car.brand)} ${UI.esc(car.model)}</strong></td>
            <td>${UI.date(r.start_date)} – ${UI.date(r.end_date)}<div class="small muted">${API.dayCount(r.start_date, r.end_date)} days</div></td>
            <td>${UI.money(r.total_price)}</td>
            <td>${UI.money(p)}</td>
            <td><strong>${UI.money(rest)}</strong></td>
            <td>${UI.badge(r.status)}</td>
            <td>${r.status === "Pending" ? `<button class="btn btn-ghost btn-sm" data-cancel="${r.id}">Cancel</button>` : ""}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>`;

    box.querySelectorAll("[data-cancel]").forEach(btn => btn.addEventListener("click", async () => {
      if (!confirm("Cancel this booking?")) return;
      btn.disabled = true;
      try {
        await API.update("rentals", btn.dataset.cancel, { status: "Cancelled" });
        UI.toast("Booking cancelled.", "ok");
        render();
      } catch (e) { UI.toast(e.message, "bad"); btn.disabled = false; }
    }));
  }

  if (newId) {
    document.getElementById("notice").innerHTML =
      `<div class="card card-pad" style="margin-bottom:20px;border-color:var(--ok);background:var(--ok-soft)">
         <strong style="color:var(--ok)">Booking received.</strong> Your rental #${newId} is pending — pay at the counter on pick-up.
       </div>`;
  }
  render();
})();
</script>
</body>
</html>
