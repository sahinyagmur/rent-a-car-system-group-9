
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent a Car Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #eef2f7;
            font-family: Arial, sans-serif;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: #1e40af;
            text-align: center;
            margin-bottom: 30px;
        }

        .login-box {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button, .demo-link {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 15px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        .demo-link {
            margin-top: 15px;
            background-color: #e2e8f0;
            color: #1e40af;
            text-decoration: none;
        }

        .note {
            color: #64748b;
            font-size: 12px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <h1>Rent a Car Management System</h1>

    <div class="login-box">
        <h2>Login</h2>

        <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" type="text"
                   placeholder="Enter username" required>

            <label for="password">Password</label>
            <input id="password" type="password"
                   placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <p class="note">
            Login authentication is not connected yet.
        </p>

        <a class="demo-link" href="dashboard.html">
            View Demo Dashboard
        </a>
    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                alert("Login will be enabled after backend integration.");
            });
    </script>
</body>
</html>
